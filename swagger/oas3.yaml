openapi: 3.0.0
info:
  title: ActiviTN OpenAPI 3.0
  description: API for managing events and groups.
  license:
    name: GPL
  version: "1"
servers:
- url: http://localhost:8000/api/v1
  description: Localhost

paths:
  /auth/register:
    post:
      summary: Creates and registers a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/login:
    post:
      summary: Gives the JWT token to users with credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Login completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier for the user
                  name:
                    type: string
                    description: Username
                  email:
                    type: string
                    description: User's email address
                  token:
                    type: string
                    description: JWT token returned after successful registration

  /events:
    post:
      summary: Create a new event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
    get:
      summary: Get all events
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  /events/{id}:
    get:
      summary: Get an event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
    delete:
      summary: Delete an event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Event deleted
        '404':
          description: Event not found
    patch:
      summary: Update an event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
    
  /events/{eventId}/{userId}:
    post:
      summary: Add a user to an event
      description: Allows a user to join an event by adding their user ID to the event's attendees.
      parameters:
        - name: eventId
          in: path
          required: true
          description: The ID of the event to join.
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: The ID of the user joining the event.
          schema:
            type: string
      responses:
        '200':
          description: Successfully added user to event
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User added to event successfully.
                  event:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 60d5ec49f0f6b620d8b8b9bb
                      name:
                        type: string
                        example: "Music Concert"
                      attendees:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: 60d5ec49f0f6b620d8b8b9cc
                            name:
                              type: string
                              example: "John Doe"
                            email:
                              type: string
                              example: "johndoe@example.com"
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Event not found.
    delete:
      summary: Remove a user from an event
      description: Allows removal of a user from an event's attendees by user ID.
      parameters:
        - name: eventId
          in: path
          required: true
          description: The ID of the event from which to remove the user.
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: The ID of the user to be removed from the event.
          schema:
            type: string
      responses:
        '200':
          description: Successfully removed user from event
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User removed from event successfully.
                  event:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 1
                      name:
                        type: string
                        example: "Music Concert"
                      attendees:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: 2
                            name:
                              type: string
                              example: "John Doe"
                            email:
                              type: string
                              example: "johndoe@example.com"
        '404':
          description: Event or user not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Event or user not found.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Server error.

  /users:
    get:
      summary: Get all users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    delete:
      summary: Delete a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found
    patch:
      summary: Update a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}/events:
    get:
      summary: Get all events organized by a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  /users/{id}/participations:
    get:
      summary: Get all events where a user has participated
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  /users/{id}/subscriptions:
    get:
      summary: Get all events at which a user is subscribed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'



components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string

    Event:
      type: object
      required:
        - id
        - name
        - description
        - date
        - location
        - organizer
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        location:
          type: string
        group:
          type: string
          description: 'Link to the group'
        organizer:
          type: string
          description: 'Link to the organizer'
      
    Message:
      type: object
      required:
        - id
        - sender
        - event
        - date
        - content
      properties:
        id:
          type: string
        sender:
          type: string
          description: 'Link to the sender'
        event:
          type: string
          description: 'Link to the event'
        date:
          type: string
          format: date-time
        content:
          type: string

    Group:
      type: object
      required:
        - id
        - name
        - description
        - organizer
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        organizer:
          type: string
          description: 'Link to the organizer'